[project]
name = "bell-core"
version = "0.3.0"
description = "Full-stack Bell coaching intelligence backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.30","sqlalchemy>=2.0","pydantic>=2.8","pydantic-settings>=2.4","email-validator>=2.2","PyJWT>=2.9","python-multipart>=0.0.9","alembic>=1.13"]
[project.optional-dependencies]
dev=["pytest>=8","httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
