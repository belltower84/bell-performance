<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Refresh Bell Performance</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090b;color:#f4f6f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(560px,calc(100% - 36px));padding:32px;border:1px solid #3a3524;border-radius:18px;background:#10161c}
    h1{margin:0 0 10px;color:#e5b51f}p{color:#b6bec7;line-height:1.55}.status{margin-top:18px;padding:14px;border-radius:10px;background:#090e13}
  </style>
</head>
<body>
<main>
  <h1>Refreshing Bell Performance</h1>
  <p>This removes stale application caches and service workers while preserving the athlete profile and workout history stored in local storage.</p>
  <div class="status" id="status">Preparing refresh…</div>
</main>
<script>
(async function(){
  const status=document.getElementById("status");
  try{
    status.textContent="Unregistering old service workers…";
    if("serviceWorker" in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    status.textContent="Removing stale Bell caches…";
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith("bell-performance-")).map(key=>caches.delete(key)));
    }
    status.textContent="Opening Bell Performance 13.22.8…";
    location.replace("./?build=13228&refresh="+Date.now());
  }catch(error){
    status.textContent="Automatic refresh failed. Return to the app and perform a hard reload. "+(error?.message||"");
  }
})();
</script>
</body>
</html>
