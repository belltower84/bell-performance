<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refresh Bell Performance</title><style>body{font-family:system-ui;background:#080c10;color:#f7f7f4;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:620px;padding:28px;border:1px solid #39434d;border-radius:18px;background:#10161d}button{padding:14px 18px;border:0;border-radius:10px;background:#e2b21f;font-weight:800}</style></head><body><div class="card"><h1>Refresh Bell Performance</h1><p id="status">Removing old application caches while preserving your athlete profile and workout history…</p><button id="go" hidden>Return to Bell</button></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('bell-performance-')).map(k=>caches.delete(k)));}document.getElementById('status').textContent='Refresh complete. Your local profile was preserved.';}catch(e){document.getElementById('status').textContent='Refresh attempted. Continue back to Bell.';}const b=document.getElementById('go');b.hidden=false;b.onclick=()=>location.replace('./?build=132219');})();</script></body></html>
